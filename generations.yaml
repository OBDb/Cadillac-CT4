generations:
  - name: "First Generation"
    start_year: 2020
    end_year: 2026
    description: "The Cadillac CT4 is a compact luxury sedan that replaced the ATS in Cadillac's lineup. Built on GM's Alpha platform with a rear-wheel drive layout (all-wheel drive optional), it features Cadillac's Art & Science design language with distinctive vertical lighting elements, sharp creases, and a fastback-like profile. The base engine is a 2.0L turbocharged four-cylinder producing 237 HP, while the CT4-V sport model features a 2.7L turbocharged four-cylinder with 325 HP. The high-performance CT4-V Blackwing, introduced in 2022, is powered by a twin-turbocharged 3.6L V6 delivering 472 HP, available with either a 6-speed manual or 10-speed automatic transmission. The CT4 went on sale in Q2 2020 and production will end in June 2026."
